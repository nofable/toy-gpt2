[project]
name = "toy-gpt2"
version = "0.1.0"
description = "GPT-2 (124M) built and trained from scratch"
readme = "README.md"
authors = [
    { name = "William Woodhead", email = "6097010+nofable@users.noreply.github.com" }
]
requires-python = ">=3.12"
dependencies = [
    "matplotlib>=3.11.2",
    "numpy>=2.5.4",
    "tiktoken>=0.14.0",
    "torch>=2.15.0",
    "pyarrow>=19.0.0",
]

[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"

[tool.pyright]
venvPath = "."
venv = ".venv"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]
